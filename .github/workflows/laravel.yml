name: Checks

# Fast checks that need no dependencies: a valid composer.json, and every PHP file parsing.
# The Testbench suite runs in tests.yml.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Composer validate · PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Check PHP syntax
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l
